<!DOCTYPE html>
<html>

<head>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@100;300;400;500;700;900&display=swap" rel="stylesheet">
    <link href="vendor/bootstrap/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://use.fontawesome.com/releases/v5.8.1/css/all.css" crossorigin="anonymous">
    <link href="https://cdn.jsdelivr.net/npm/@mdi/font@6.x/css/materialdesignicons.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/vuetify@2.x/dist/vuetify.min.css" rel="stylesheet">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, minimal-ui">
</head>

<body>
    <div id="app">
        <v-app>
            <v-main>
                <v-container>
                    <v-card class="mx-auto" max-width="400">
                        <v-card-title class="blue white--text d-flex align-center">
                            <v-btn icon @click="cambiarGif">
                                <v-icon>mdi-menu</v-icon>
                            </v-btn>
                            <h3 class="text-h6 font-weight-light text-center flex-grow-1">
                                Tracking Pedido
                            </h3>
                            <v-avatar>
                                <v-img src="https://avataaars.io/?avatarStyle=Circle&topType=LongHairStraight&hairColor=BrownDark"></v-img>
                            </v-avatar>
                        </v-card-title>

                        <v-card elevation="2" class="mt-3">
                            <v-form ref="form">
                                <v-text-field v-model.trim="codigo" label="Código de Pedido" :rules="[rules.required]" required></v-text-field>
                                <v-btn color="primary" block @click="consultatracking">
                                    Buscar Pedido
                                </v-btn>
                            </v-form>
                        </v-card>

                        <!-- Sección que muestra la imagen GIF -->
                        <v-img :src="gifActual" class="mt-3" height="200" contain>
                            <v-container>
                                <v-row align="center">
                                    <strong class="text-h4">Estado de Entrega</strong>
                                </v-row>
                            </v-container>
                        </v-img>

                        <!-- Sección que muestra la información del tracking -->
                        <v-card v-if="trackingData" class="mt-3">
                            <v-card-title>{{ trackingData.estado }}</v-card-title>
                            <v-card-text>
                                <v-timeline align-top dense>
                                    <v-timeline-item v-for="(item, index) in trackingData.historial" :key="index" :color="item.color" small>
                                        <v-row>
                                            <v-col cols="3">
                                                <strong>{{ item.hora }}</strong>
                                            </v-col>
                                            <v-col>
                                                <strong>{{ item.evento }}</strong>
                                                <div class="text-caption">{{ item.descripcion }}</div>
                                            </v-col>
                                        </v-row>
                                    </v-timeline-item>
                                </v-timeline>
                            </v-card-text>
                        </v-card>

                        <v-alert v-if="mensajeError" type="error" class="mt-3">
                            {{ mensajeError }}
                        </v-alert>
                    </v-card>
                </v-container>
            </v-main>
        </v-app>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/vue@2.x/dist/vue.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/vuetify@2.x/dist/vuetify.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>

    <script>
        new Vue({
            el: '#app',
            vuetify: new Vuetify(),
            data() {
                return {
                    codigo: '',
                    trackingData: null, // Almacena los datos del pedido
                    mensajeError: '',
                    gifActual: 'assets/images/delivery.gif', // Almacena el GIF actual
                    rules: {
                        required: value => !!value || 'Este campo es obligatorio.'
                    }
                };
            },
            methods: {
                cambiarGif() {
                    // Cambia el GIF actual al hacer clic en el botón
                    this.gifActual = this.gifActual === 'assets/images/delivery.gif' ? 'assets/images/otro_gif.gif' : 'assets/images/delivery.gif';
                },
                async consultatracking() {
                    if (!this.$refs.form.validate()) {
                        this.mensajeError = 'Por favor ingresa un código válido.';
                        return;
                    }

                    try {
                        const response = await axios.post(
                            'https://darkslateblue-horse-824662.hostingersite.com/tracking_pedidov1/api.php/tracking',
                            { codigo: this.codigo }
                        );

                        // Asegúrate de que la respuesta tenga los datos correctos
                        if (response.data && response.data.estado) {
                            this.trackingData = response.data; // Actualiza automáticamente el estado
                            this.mensajeError = ''; // Limpia mensajes de error previos
                        } else {
                            this.mensajeError = 'No se encontraron resultados para este código.';
                            this.trackingData = null;
                        }
                    } catch (error) {
                        console.error('Error en la API:', error);
                        this.mensajeError = 'Hubo un error en la búsqueda. Inténtalo de nuevo.';
                        this.trackingData = null;
                    }
                }
            }
        });
    </script>
</body>

</html>
